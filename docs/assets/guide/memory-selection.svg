<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="717" viewBox="0 0 1200 717" role="img" aria-labelledby="title desc">
<title id="title">What does an agent remember?</title><desc id="desc">Memory selection narrows context; it does not enable tools or grant authority.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b1c0ff"/></marker></defs>
<rect width="1200" height="717" rx="22" fill="#101218"/>
<text x="40" y="48" fill="#b1c0ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">NEXUSIDE / FIELD GUIDE</text><text x="40" y="91" fill="#f3f4fa" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">What does an agent remember?</text><text x="40" y="126" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Memory selection narrows context; it does not enable tools or grant authority.</text>
<rect x="40" y="175" width="610" height="90" rx="16" fill="#191d28" stroke="#8cdec5"/><text x="62" y="214" fill="#8cdec5" font-size="26" font-weight="700" font-family="Arial, Helvetica, sans-serif">L1</text><text x="126" y="214" fill="#f3f4fa" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">Facts • decisions • constraints • procedures</text><text x="126" y="244" fill="#bbc3d5" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Project scope or one owning agent</text><rect x="40" y="287" width="610" height="90" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="62" y="326" fill="#b1c0ff" font-size="26" font-weight="700" font-family="Arial, Helvetica, sans-serif">L2</text><text x="126" y="326" fill="#f3f4fa" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">Project and task summaries</text><text x="126" y="356" fill="#bbc3d5" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Project scope or one owning agent</text><rect x="40" y="399" width="610" height="90" rx="16" fill="#191d28" stroke="#f2cd91"/><text x="62" y="438" fill="#f2cd91" font-size="26" font-weight="700" font-family="Arial, Helvetica, sans-serif">L3</text><text x="126" y="438" fill="#f3f4fa" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">Lasting user preferences</text><text x="126" y="468" fill="#bbc3d5" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Project scope or one owning agent</text><path d="M662,332 L707,332" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="722" y="175" width="438" height="314" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="745" y="217" fill="#f3f4fa" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Agent selection</text><text x="745" y="260" fill="#bbc3d5" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Project: all / selected / none</text><text x="745" y="293" fill="#bbc3d5" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Agent: own private notes only</text><text x="745" y="326" fill="#bbc3d5" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Choose layers and context budget</text><text x="745" y="359" fill="#bbc3d5" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Exclude expired / archived notes</text><text x="745" y="392" fill="#bbc3d5" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Relevant keywords + recent L2/L3</text><rect x="40" y="548" width="1120" height="110" rx="16" fill="#191d28" stroke="#8cdec5"/><text x="61" y="583" fill="#f3f4fa" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">Startup context and retrieval</text><text x="61" y="620" fill="#bbc3d5" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Eligible notes inform the task. Saving a proposed note needs approval; extracted draft memories stay</text><text x="61" y="648" fill="#bbc3d5" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">inactive until reviewed.</text><text x="40" y="693" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
</svg>