<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Connect only what the task needs</title><desc id="desc">Optional capabilities have their own installation, grants and evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b1c0ff"/></marker></defs>
<rect width="1200" height="740" rx="22" fill="#101218"/>
<text x="40" y="48" fill="#b1c0ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">NEXUSIDE / FIELD GUIDE</text><text x="40" y="91" fill="#f3f4fa" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Connect only what the task needs</text><text x="40" y="126" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Optional capabilities have their own installation, grants and evidence.</text>
<rect x="40" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">1</text><text x="99" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Research Harness</text><text x="63" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Separate research project and</text><text x="63" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Python environment. Reader bridge</text><text x="63" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">returns scoped evidence and saved</text><text x="63" y="323" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">context.</text><path d="M403,271 L417,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">2</text><text x="479" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Cortex</text><text x="443" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Separate pinned Python engine and</text><text x="443" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">brain. Three bounded tools read</text><text x="443" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">notes with hashes and status</text><text x="443" y="323" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">labels.</text><path d="M783,271 L797,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">3</text><text x="859" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Code map</text><text x="823" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Existing codebase-memory index.</text><text x="823" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Direct caller/callee queries;</text><text x="823" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">inspect current source to confirm</text><text x="823" y="323" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">edges.</text><rect x="40" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">4</text><text x="99" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Anatomy</text><text x="63" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Bundled optional SVG subset and</text><text x="63" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">technical-illustrator agent.</text><text x="63" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Commands are disabled by default.</text><path d="M403,495 L417,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">5</text><text x="479" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Managed runtimes</text><text x="443" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">TradingAgents and OpenMontage</text><text x="443" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">need their own setup,</text><text x="443" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">environment, launch approval and</text><text x="443" y="547" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">validation.</text><path d="M783,495 L797,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">6</text><text x="859" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Native adaptations</text><text x="823" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Checkpoint/retry patterns, RAM</text><text x="823" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">guidance and offline</text><text x="823" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">RRSI-inspired evaluation use the</text><text x="823" y="547" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Nexus runtime.</text><rect x="40" y="614" width="1120" height="72" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="60" y="644" fill="#f3f4fa" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Installing Nexus does not install every model, private knowledge base or external application.</text><text x="40" y="716" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
</svg>