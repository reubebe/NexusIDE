<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="719" viewBox="0 0 1200 719" role="img" aria-labelledby="title desc">
<title id="title">How editors connect to Nexus</title><desc id="desc">The editor is an interface; the project folder determines configuration and history.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b1c0ff"/></marker></defs>
<rect width="1200" height="719" rx="22" fill="#101218"/>
<text x="40" y="48" fill="#b1c0ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">NEXUSIDE / FIELD GUIDE</text><text x="40" y="91" fill="#f3f4fa" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">How editors connect to Nexus</text><text x="40" y="126" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">The editor is an interface; the project folder determines configuration and history.</text>
<rect x="40" y="182" width="360" height="122" rx="16" fill="#191d28" stroke="#353c51"/><text x="62" y="224" fill="#f3f4fa" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">VS Code</text><text x="62" y="261" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Thin launcher → integrated</text><text x="62" y="289" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">terminal</text><path d="M220,309 L220,370" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="182" width="360" height="122" rx="16" fill="#191d28" stroke="#353c51"/><text x="442" y="224" fill="#f3f4fa" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Zed</text><text x="442" y="261" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Agent Client Protocol or tasks</text><path d="M600,309 L600,370" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="182" width="360" height="122" rx="16" fill="#191d28" stroke="#353c51"/><text x="822" y="224" fill="#f3f4fa" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Terminal / desktop</text><text x="822" y="261" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">CLI or shared browser dashboard</text><path d="M980,309 L980,370" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="378" width="1120" height="130" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="70" y="421" fill="#f3f4fa" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif">One project / one shared Nexus runtime</text><text x="70" y="461" fill="#bbc3d5" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif">Agent definitions • provider routes • approvals • history • memory</text><rect x="40" y="558" width="1120" height="98" rx="16" fill="#191d28" stroke="#353c51"/><text x="65" y="596" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Open the intended project in each interface. The source checkout location is not automatically the</text><text x="65" y="624" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">workspace you want the agent to change.</text><text x="40" y="695" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
</svg>