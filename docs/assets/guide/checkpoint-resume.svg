<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Continue without replaying completed work</title><desc id="desc">Checkpoint mode is explicit and currently available through the CLI.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b1c0ff"/></marker></defs>
<rect width="1200" height="740" rx="22" fill="#101218"/>
<text x="40" y="48" fill="#b1c0ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">NEXUSIDE / FIELD GUIDE</text><text x="40" y="91" fill="#f3f4fa" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Continue without replaying completed work</text><text x="40" y="126" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Checkpoint mode is explicit and currently available through the CLI.</text>
<rect x="40" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">1</text><text x="99" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Opt in</text><text x="63" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Start a supported file-tool team</text><text x="63" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">with --checkpoint. No memory,</text><text x="63" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">MCP, applications or commands.</text><path d="M403,271 L417,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">2</text><text x="479" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Save boundaries</text><text x="443" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Nexus stores completed stages and</text><text x="443" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">fingerprints of accessible files,</text><text x="443" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">config, skills and model choices.</text><path d="M783,271 L797,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">3</text><text x="859" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Stop and inspect</text><text x="823" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">A failed or cancelled workflow</text><text x="823" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">keeps its history. Inspect files</text><text x="823" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">and pending stages before</text><text x="823" y="323" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">continuing.</text><rect x="40" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">4</text><text x="99" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Validate resume</text><text x="63" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">team resume ID checks unchanged</text><text x="63" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">inputs and asks approval. Active</text><text x="63" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">or legacy workflows are refused.</text><path d="M403,495 L417,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">5</text><text x="479" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Reuse safely</text><text x="443" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Completed stages are reused. An</text><text x="443" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">unfinished write-capable stage is</text><text x="443" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">blocked because effects are</text><text x="443" y="547" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">uncertain.</text><path d="M783,495 L797,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">6</text><text x="859" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">New linked record</text><text x="823" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Pending stages run with their</text><text x="823" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">normal approvals. One claim per</text><text x="823" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">checkpoint; at most two</text><text x="823" y="547" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">continuations.</text><rect x="40" y="614" width="1120" height="72" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="60" y="644" fill="#f3f4fa" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">A changed workspace needs a new task. Checkpoints do not undo writes or capture external service state.</text><text x="40" y="716" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
</svg>