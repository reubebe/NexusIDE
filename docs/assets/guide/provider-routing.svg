ollama-local</text><text x="438" y="525" fill="#bbc3d5" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">INSTALLED_MODEL</text><path d="M775,505 L796,505" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="460" width="350" height="90" rx="16" fill="#191d28" stroke="#353c51"/><text x="818" y="494" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">reviewer</text><text x="818" y="525" fill="#bbc3d5" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Explicit route</text><rect x="40" y="596" width="1120" height="90" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="60" y="628" fill="#f3f4fa" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">Effective model selection for an individual agent run</text><text x="60" y="661" fill="#b1c0ff" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Per-run override → agent-pinned profile → agent route → workspace default → runtime environment</text><text x="40" y="720" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
