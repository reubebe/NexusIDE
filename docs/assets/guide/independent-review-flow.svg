<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="728" viewBox="0 0 1200 728" role="img" aria-labelledby="title desc">
<title id="title">Independent review, with evidence</title><desc id="desc">Different accounts for the same model do not make independent reviewers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b1c0ff"/></marker></defs>
<rect width="1200" height="728" rx="22" fill="#101218"/>
<text x="40" y="48" fill="#b1c0ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">NEXUSIDE / FIELD GUIDE</text><text x="40" y="91" fill="#f3f4fa" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Independent review, with evidence</text><text x="40" y="126" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Different accounts for the same model do not make independent reviewers.</text>
<rect x="40" y="180" width="360" height="195" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="213" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="220" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">1</text><text x="99" y="219" fill="#f3f4fa" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Plan</text><text x="62" y="264" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Architect reads source and</text><text x="62" y="292" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">proposes the work.</text><rect x="420" y="180" width="360" height="195" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="213" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="220" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">2</text><text x="479" y="219" fill="#f3f4fa" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Plan review</text><text x="442" y="264" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Distinct model: approve,</text><text x="442" y="292" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">revise or block.</text><rect x="800" y="180" width="360" height="195" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="213" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="220" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">3</text><text x="859" y="219" fill="#f3f4fa" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Build gate</text><text x="822" y="264" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Human approval before</text><text x="822" y="292" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">implementation.</text><rect x="800" y="420" width="360" height="195" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="453" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="460" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">4</text><text x="859" y="459" fill="#f3f4fa" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Implement</text><text x="822" y="504" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Coder changes files and runs</text><text x="822" y="532" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">permitted checks.</text><rect x="420" y="420" width="360" height="195" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="453" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="460" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">5</text><text x="479" y="459" fill="#f3f4fa" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Inspect</text><text x="442" y="504" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Fresh distinct model reads</text><text x="442" y="532" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">current source.</text><rect x="40" y="420" width="360" height="195" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="453" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="460" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">6</text><text x="99" y="459" fill="#f3f4fa" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Human review</text><text x="62" y="504" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Inspect diffs and tests.</text><text x="62" y="532" fill="#bbc3d5" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Decide whether to commit.</text><path d="M403,275 L415,275" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M783,275 L795,275" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980,379 L980,413" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M796,517 L785,517" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M416,517 L405,517" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="43" y="667" fill="#f2cd91" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">A revise verdict uses a bounded new plan round. A blocked or invalid verdict stops the workflow.</text><text x="40" y="704" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
</svg>