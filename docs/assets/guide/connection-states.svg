<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">A key is only the first step</title><desc id="desc">Each status answers a different question about a model connection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b1c0ff"/></marker></defs>
<rect width="1200" height="740" rx="22" fill="#101218"/>
<text x="40" y="48" fill="#b1c0ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">NEXUSIDE / FIELD GUIDE</text><text x="40" y="91" fill="#f3f4fa" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">A key is only the first step</text><text x="40" y="126" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Each status answers a different question about a model connection.</text>
<rect x="40" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">1</text><text x="99" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Key detected</text><text x="63" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">The running Nexus process can see</text><text x="63" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">an environment variable. No key</text><text x="63" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">value is shown.</text><path d="M403,271 L417,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">2</text><text x="479" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Models listed</text><text x="443" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">The selected account answered a</text><text x="443" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">catalog request. No project task</text><text x="443" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">was sent.</text><path d="M783,271 L797,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">3</text><text x="859" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Route saved</text><text x="823" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Use this model assigns that</text><text x="823" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">selection to the workspace</text><text x="823" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">default or one agent.</text><rect x="40" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">4</text><text x="99" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Text verified</text><text x="63" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">A synthetic generation request</text><text x="63" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">succeeded for the chosen profile</text><text x="63" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">and model.</text><path d="M403,495 L417,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">5</text><text x="479" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Tools verified</text><text x="443" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">The model requested tools,</text><text x="443" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">consumed their results, and</text><text x="443" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">returned an observed answer.</text><path d="M783,495 L797,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">6</text><text x="859" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Workflow reviewed</text><text x="823" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Inspect real changes, evidence</text><text x="823" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">and tests. A successful API check</text><text x="823" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">does not certify a workflow.</text><rect x="40" y="614" width="1120" height="72" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="60" y="644" fill="#f3f4fa" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">If a check fails, inspect that account and model. Nexus does not rotate accounts or regions automatically.</text><text x="40" y="716" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
</svg>