<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Two kinds of retrieval</title><desc id="desc">Memory notes and project code/documents have separate indexes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b1c0ff"/></marker></defs>
<rect width="1200" height="740" rx="22" fill="#101218"/>
<text x="40" y="48" fill="#b1c0ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">NEXUSIDE / FIELD GUIDE</text><text x="40" y="91" fill="#f3f4fa" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Two kinds of retrieval</text><text x="40" y="126" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Memory notes and project code/documents have separate indexes.</text>
<rect x="40" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">1</text><text x="99" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Save or edit</text><text x="63" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Write governed memory notes, or</text><text x="63" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">edit normal source files and</text><text x="63" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">project documents.</text><path d="M403,271 L417,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">2</text><text x="479" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Refresh index</text><text x="443" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Memory keywords update on save.</text><text x="443" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Code search needs project index.</text><text x="443" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Semantic vectors refresh</text><text x="443" y="323" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">explicitly.</text><path d="M783,271 L797,271" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="166" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="198" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="205" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">3</text><text x="859" y="204" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Optional embeddings</text><text x="823" y="245" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">A local embedding model converts</text><text x="823" y="271" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">eligible text to vectors. It is</text><text x="823" y="297" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">separate from the chat model.</text><rect x="40" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="70" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="64" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">4</text><text x="99" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Search</text><text x="63" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Choose lexical for local</text><text x="63" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">keywords. Hybrid combines</text><text x="63" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">keywords and current vectors when</text><text x="63" y="547" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">available.</text><path d="M403,495 L417,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="450" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="444" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">5</text><text x="479" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Check freshness</text><text x="443" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Changed or deleted content is</text><text x="443" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">excluded. Read warnings, stale</text><text x="443" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">counts and truncated coverage.</text><path d="M783,495 L797,495" fill="none" stroke="#b1c0ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="390" width="360" height="202" rx="16" fill="#191d28" stroke="#353c51"/><circle cx="830" cy="422" r="19" fill="#b1c0ff" stroke="#101218" stroke-width="3"/><text x="824" y="429" fill="#101218" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">6</text><text x="859" y="428" fill="#f3f4fa" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Verify source</text><text x="823" y="469" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Open the original file or note.</text><text x="823" y="495" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Retrieved context is evidence to</text><text x="823" y="521" fill="#bbc3d5" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">assess, not automatic proof.</text><rect x="40" y="614" width="1120" height="72" rx="16" fill="#191d28" stroke="#b1c0ff"/><text x="60" y="644" fill="#f3f4fa" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Indexing is incremental and explicit, not a background file watcher. Semantic commands require current</text><text x="60" y="669" fill="#f3f4fa" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">vectors.</text><text x="40" y="716" fill="#bbc3d5" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">NexusIDE guide • Read the accompanying instructions for requirements and limits.</text>
</svg>