name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:pilot
      - run: node scripts/verify-storage-scale.js
      - run: npm audit --omit=dev --audit-level=high
      - if: runner.os == 'macOS'
        run: npm run desktop:build
      - if: runner.os == 'macOS'
        run: npm run desktop:package
      - if: runner.os == 'macOS'
        run: npm run desktop:verify-bundle
      - if: runner.os == 'macOS'
        run: npm run verify:release
