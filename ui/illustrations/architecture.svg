<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1050" role="img" aria-labelledby="title desc">
  <title id="title">NexusIDE architecture: one runtime, several interfaces</title>
  <desc id="desc">The CLI, local dashboard and macOS shell, and VS Code and Zed adapters share an agent runtime. It combines agent definitions and scoped memory, validated workflow plans, permissions and action approvals. The runtime uses configured model providers, project tools and explicitly granted external connections. Runs and memory are stored locally in SQLite; configuration, definitions and the encrypted vault remain separate files. Remote providers and external services have their own data boundaries.</desc>
  <defs>
    <linearGradient id="runtime" x1="48" y1="314" x2="912" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#202a43"/><stop offset="1" stop-color="#181e2b"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.7" refY="3.5" orient="auto"><path d="m0 0 6 3.5L0 7" fill="none" stroke="#8d9bb8" stroke-width="1.3"/></marker>
  </defs>
  <rect width="960" height="1050" rx="22" fill="#111216"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#afc3ff" x="48" y="49" font-size="12px" font-weight="650" letter-spacing="2px">NEXUSIDE / SYSTEM MAP</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#f3f4f7" x="48" y="94" font-size="31px" font-weight="650" letter-spacing="-1px">One workspace. One shared runtime.</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#b7bdca" x="48" y="123" font-size="15px">Choose your interface. Keep your agents, controls and project context.</text>

