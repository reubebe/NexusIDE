  <path d="m73 181 7 6-7 6m13 0h9" fill="none" stroke="#bed0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#f3f4f7" x="108" y="194" font-size="20px" font-weight="620" letter-spacing="-.35px">Terminal CLI</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#b7bdca" x="72" y="226" font-size="15px">Tasks, teams and project tools</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#a1a9b9" x="72" y="248" font-size="13px">Direct access to the runtime</text>
  <rect x="342" y="156" width="276" height="116" rx="13" fill="#191c23" stroke="#363c48" stroke-width="1"/>
  <rect x="366" y="179" width="24" height="17" rx="2" fill="none" stroke="#bed0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M378 196v5m-5 0h10" fill="none" stroke="#bed0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#f3f4f7" x="404" y="194" font-size="20px" font-weight="620" letter-spacing="-.35px">Dashboard + macOS</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#b7bdca" x="366" y="226" font-size="15px">A local browser or native shell</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#a1a9b9" x="366" y="248" font-size="13px">Tasks, approvals, files and PTY</text>
  <rect x="636" y="156" width="276" height="116" rx="13" fill="#191c23" stroke="#363c48" stroke-width="1"/>
  <path d="m667 180-7 7 7 7m12-14 7 7-7 7m-3-16-6 18" fill="none" stroke="#bed0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#f3f4f7" x="698" y="194" font-size="20px" font-weight="620" letter-spacing="-.35px">Editor adapters</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#b7bdca" x="660" y="226" font-size="15px">VS Code launcher · Zed ACP</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#a1a9b9" x="660" y="248" font-size="13px">Existing editors, shared agents</text>
